<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>SG Estetal — Inhalte bearbeiten</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#F7F6F1;color:#1B1B1B;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
    .box{max-width:460px;background:#fff;border-radius:14px;padding:32px;
         box-shadow:0 2px 16px rgba(0,0,0,.08);border-top:4px solid #14532D}
    h1{font-size:1.25rem;margin:0 0 12px}
    p{font-size:.95rem;line-height:1.6;color:#444;margin:0 0 16px}
    a.btn{display:inline-block;background:#14532D;color:#fff;text-decoration:none;
          padding:12px 20px;border-radius:8px;font-weight:600}
    code{background:#EFEFEA;padding:2px 6px;border-radius:4px;font-size:.85em}
  </style>
</head>
<body>
  <div class="box">
    <h1>SG Estetal – Redaktionslogin</h1>
    <p>Melde dich mit der E-Mail-Adresse an, an die deine Einladung ging.
       Im Redaktionsbereich kannst du Texte, Mannschaften, Termine und Bilder bearbeiten.</p>
    <p><a class="btn" href="https://app.pagescms.org/" rel="noopener">Zum Redaktionsbereich →</a></p>
    <p>Noch keine Einladung erhalten? Melde dich unter
       <code>fussball@sg-estetal.de</code>.</p>
  </div>
</body>
</html>
